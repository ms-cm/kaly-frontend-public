<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Inscription — KALY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --rose:      #e8a0b0;
      --rose-deep: #c9687e;
      --gold:      #c9a84c;
      --dark:      #1a1218;
      --mid:       #2e2129;
      --soft:      #f7f1f3;
      --muted:     #8a717a;
      --white:     #ffffff;
    }
    html, body { height:100%; }
    body {
      font-family:'DM Sans', sans-serif;
      background: var(--dark);
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:20px;
      position:relative; overflow-x:hidden;
    }
    body::before {
      content:''; position:fixed;
      width:600px; height:600px;
      background: radial-gradient(circle, rgba(201,104,126,.18) 0%, transparent 70%);
      top:-150px; left:-150px; pointer-events:none;
    }
    body::after {
      content:''; position:fixed;
      width:500px; height:500px;
      background: radial-gradient(circle, rgba(201,168,76,.12) 0%, transparent 70%);
      bottom:-150px; right:-150px; pointer-events:none;
    }

    .card {
      width:100%; max-width:440px;
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.1);
      border-radius:24px; padding:40px 36px;
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      position:relative; z-index:1;
      animation: cardIn .5s ease both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .back-link {
      display:inline-flex; align-items:center; gap:7px;
      color:rgba(255,255,255,.45); font-size:.82rem; text-decoration:none;
      margin-bottom:28px; transition:color .2s;
    }
    .back-link:hover { color:var(--rose); }

    .auth-logo {
      display:flex; align-items:center; gap:10px; margin-bottom:28px;
      text-decoration:none;
    }
    .auth-logo-icon {
      width:40px; height:40px; border-radius:12px;
      background:linear-gradient(135deg, var(--rose-deep), var(--gold));
      display:flex; align-items:center; justify-content:center; font-size:20px;
    }
    .auth-logo-text {
      font-family:'Cormorant Garamond',serif;
      font-size:1.6rem; font-weight:700; color:var(--white);
    }
    .auth-logo-text span { color:var(--gold); }

    .auth-title {
      font-family:'Cormorant Garamond',serif;
      font-size:1.9rem; font-weight:700; color:var(--white);
      margin-bottom:6px; line-height:1.1;
    }
    .auth-sub { color:rgba(255,255,255,.45); font-size:.88rem; margin-bottom:28px; }

    /* Progress dots */
    .progress-steps {
      display:flex; gap:6px; margin-bottom:28px;
    }
    .step-dot {
      height:4px; border-radius:99px;
      background:rgba(255,255,255,.15); transition:all .3s;
    }
    .step-dot.done  { background:var(--gold); flex:2; }
    .step-dot.active{ background:var(--rose-deep); flex:2; }
    .step-dot.idle  { flex:1; }

    .field { margin-bottom:16px; }
    .field label {
      display:block; font-size:.8rem; font-weight:600;
      color:rgba(255,255,255,.6); margin-bottom:7px; letter-spacing:.03em;
    }
    .input-wrap { position:relative; }
    .input-wrap i.icon {
      position:absolute; left:14px; top:50%; transform:translateY(-50%);
      color:rgba(255,255,255,.25); font-size:.9rem; pointer-events:none;
    }
    .input-wrap input {
      width:100%; padding:13px 14px 13px 40px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px; color:var(--white); font-size:.93rem;
      font-family:'DM Sans',sans-serif;
      transition:border-color .2s, background .2s;
    }
    .input-wrap input::placeholder { color:rgba(255,255,255,.25); }
    .input-wrap input:focus {
      outline:none; border-color:var(--rose); background:rgba(255,255,255,.1);
    }
    .input-wrap input.valid   { border-color:#10b981; }
    .input-wrap input.invalid { border-color:#f87171; }

    .eye-btn {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:rgba(255,255,255,.3);
      cursor:pointer; font-size:.9rem; padding:4px; transition:color .2s;
    }
    .eye-btn:hover { color:var(--rose); }

    /* Password strength */
    .strength-bar {
      height:4px; border-radius:99px;
      background:rgba(255,255,255,.1); margin-top:8px; overflow:hidden;
    }
    .strength-fill {
      height:100%; border-radius:99px; width:0%;
      transition:width .3s, background .3s;
    }
    .strength-label { font-size:.74rem; color:rgba(255,255,255,.35); margin-top:5px; }

    /* Field hint */
    .field-hint {
      font-size:.74rem; color:rgba(255,255,255,.3); margin-top:5px;
      display:none;
    }
    .field-hint.show { display:block; }
    .field-hint.error { color:#fca5a5; }
    .field-hint.ok    { color:#6ee7b7; }

    /* Error banner */
    .error-msg {
      display:none; align-items:center; gap:8px;
      background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.25);
      border-radius:10px; padding:11px 14px;
      color:#fca5a5; font-size:.84rem; margin-bottom:16px;
    }
    .error-msg.show { display:flex; }

    /* Success banner */
    .success-msg {
      display:none; flex-direction:column; align-items:center; gap:10px;
      text-align:center; padding:20px 0;
    }
    .success-msg.show { display:flex; }
    .success-icon {
      width:60px; height:60px; border-radius:50%;
      background:rgba(16,185,129,.15); border:2px solid rgba(16,185,129,.3);
      display:flex; align-items:center; justify-content:center;
      color:#6ee7b7; font-size:1.6rem; margin-bottom:4px;
    }
    .success-msg h3 { color:var(--white); font-size:1.2rem; }
    .success-msg p  { color:rgba(255,255,255,.45); font-size:.88rem; }

    .btn-submit {
      width:100%; padding:14px;
      background:linear-gradient(135deg, var(--rose-deep), var(--gold));
      color:var(--white); border:none; border-radius:12px;
      font-size:.95rem; font-weight:700; font-family:'DM Sans',sans-serif;
      cursor:pointer; transition:opacity .2s, transform .2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
      margin-top:8px;
    }
    .btn-submit:hover:not(:disabled) { opacity:.88; transform:translateY(-1px); }
    .btn-submit:disabled { opacity:.5; cursor:not-allowed; }

    .spinner {
      width:16px; height:16px; border:2px solid rgba(255,255,255,.3);
      border-top-color:white; border-radius:50%;
      animation:spin .7s linear infinite; display:none;
    }
    .btn-submit.loading .spinner { display:block; }
    .btn-submit.loading .btn-label { display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Terms */
    .terms-row {
      display:flex; align-items:flex-start; gap:10px; margin:16px 0;
    }
    .terms-row input[type=checkbox] {
      width:16px; height:16px; margin-top:2px; accent-color:var(--rose-deep); flex-shrink:0;
    }
    .terms-row label { color:rgba(255,255,255,.4); font-size:.8rem; line-height:1.5; }
    .terms-row a { color:var(--rose); text-decoration:none; }

    .auth-footer {
      text-align:center; margin-top:22px;
      color:rgba(255,255,255,.35); font-size:.84rem;
    }
    .auth-footer a { color:var(--rose); font-weight:600; text-decoration:none; }
    .auth-footer a:hover { color:var(--rose-deep); }

    /* Benefits */
    .benefits {
      display:flex; flex-direction:column; gap:8px; margin-bottom:24px;
    }
    .benefit-item {
      display:flex; align-items:center; gap:10px;
      color:rgba(255,255,255,.45); font-size:.82rem;
    }
    .benefit-item i { color:var(--gold); width:14px; }
  </style>
</head>
<body>

<div class="card">
  <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>

  <a href="index.html" class="auth-logo">
    <div class="auth-logo-icon">🪡</div>
    <span class="auth-logo-text">KALY<span>.</span></span>
  </a>

  <h1 class="auth-title">Rejoignez KALY ✨</h1>
  <p class="auth-sub">Créez votre compte en moins d'une minute</p>

  <!-- Benefits -->
  <div class="benefits">
    <div class="benefit-item"><i class="fas fa-check-circle"></i> Suivez vos commandes facilement</div>
    <div class="benefit-item"><i class="fas fa-check-circle"></i> Accès aux offres exclusives</div>
    <div class="benefit-item"><i class="fas fa-check-circle"></i> Panier sauvegardé automatiquement</div>
  </div>

  <!-- Error banner -->
  <div class="error-msg" id="errorMsg">
    <i class="fas fa-exclamation-circle"></i>
    <span id="errorText">Erreur</span>
  </div>

  <!-- Success state -->
  <div class="success-msg" id="successMsg">
    <div class="success-icon"><i class="fas fa-check"></i></div>
    <h3>Compte créé !</h3>
    <p>Redirection vers la connexion…</p>
  </div>

  <!-- Form -->
  <div id="formWrap">
    <div class="field">
      <label>Nom complet</label>
      <div class="input-wrap">
        <i class="icon fas fa-user"></i>
        <input type="text" id="regName" placeholder="Amadou Ly" required autocomplete="name"/>
      </div>
      <div class="field-hint" id="nameHint"></div>
    </div>

    <div class="field">
      <label>Adresse email</label>
      <div class="input-wrap">
        <i class="icon fas fa-envelope"></i>
        <input type="email" id="regEmail" placeholder="exemple@mail.com" required autocomplete="email"/>
      </div>
      <div class="field-hint" id="emailHint"></div>
    </div>

    <div class="field">
      <label>Numero WhatsApp <span style="color:rgba(255,255,255,.3);font-weight:400;font-size:.75rem">(optionnel)</span></label>
      <div class="input-wrap">
        <i class="icon fas fa-phone"></i>
        <input type="tel" id="regPhone" placeholder="+XXX XX XX XX XX" autocomplete="tel"/>
      </div>
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <div class="input-wrap">
        <i class="icon fas fa-lock"></i>
        <input type="password" id="regPass" placeholder="••••••••" required autocomplete="new-password"/>
        <button class="eye-btn" type="button" id="eyeBtn"><i class="fas fa-eye" id="eyeIcon"></i></button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel">Entrez un mot de passe</div>
    </div>

    <div class="terms-row">
      <input type="checkbox" id="terms"/>
      <label for="terms">J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a> de KALY.</label>
    </div>

    <button class="btn-submit" id="submitBtn">
      <div class="spinner"></div>
      <span class="btn-label">Créer mon compte</span>
    </button>
  </div>

  <div class="auth-footer">
    Déjà inscrit ? <a href="login.html">Se connecter</a>
  </div>
</div>

<script>
const API_URL = 'https://kaly-backend.onrender.com/api';

/* ─── Password strength ───────────────────────── */
document.getElementById('regPass').addEventListener('input', function() {
  const v = this.value;
  const fill  = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  let score = 0;
  if (v.length >= 8)  score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;

  const configs = [
    { w:'0%',   c:'transparent', t:'Entrez un mot de passe' },
    { w:'25%',  c:'#ef4444',     t:'Très faible' },
    { w:'50%',  c:'#f97316',     t:'Faible' },
    { w:'75%',  c:'#eab308',     t:'Moyen' },
    { w:'100%', c:'#10b981',     t:'Fort 💪' },
  ];
  const cfg = configs[score];
  fill.style.width      = cfg.w;
  fill.style.background = cfg.c;
  label.textContent     = cfg.t;
  label.style.color     = score >= 3 ? '#6ee7b7' : 'rgba(255,255,255,.35)';
});

/* ─── Eye toggle ──────────────────────────────── */
document.getElementById('eyeBtn').addEventListener('click', () => {
  const inp  = document.getElementById('regPass');
  const icon = document.getElementById('eyeIcon');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
});

/* ─── Submit ──────────────────────────────────── */
document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn      = document.getElementById('submitBtn');
  const errorDiv = document.getElementById('errorMsg');
  const errorTxt = document.getElementById('errorText');
  const name     = document.getElementById('regName').value.trim();
  const email    = document.getElementById('regEmail').value.trim();
  const phone    = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPass').value;
  const terms    = document.getElementById('terms').checked;

  errorDiv.classList.remove('show');

  if (!name || !email || !password) {
    errorTxt.textContent = 'Veuillez remplir tous les champs.';
    errorDiv.classList.add('show'); return;
  }
  if (password.length < 6) {
    errorTxt.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
    errorDiv.classList.add('show'); return;
  }
  if (!terms) {
    errorTxt.textContent = 'Veuillez accepter les conditions d\'utilisation.';
    errorDiv.classList.add('show'); return;
  }

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const res  = await fetch(`${API_URL}/auth/register`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fullName: name, email, password, phone })
    });
    const data = await res.json();

    if (res.ok) {
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('successMsg').classList.add('show');
      setTimeout(() => window.location.href = 'login.html', 2000);
    } else {
      errorTxt.textContent = data.message || data.error || 'Une erreur est survenue.';
      errorDiv.classList.add('show');
    }
  } catch {
    errorTxt.textContent = 'Le serveur ne répond pas. Vérifiez votre connexion.';
    errorDiv.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});

/* Enter key */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('submitBtn').click();
});
</script>
</body>
</html>
