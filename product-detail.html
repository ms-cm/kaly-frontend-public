<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Produit - KALY 🪡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="KALY" onerror="this.style.display='none'">
                <h1>KALY 🪡</h1>
            </div>
            
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="products.html">Produits</a>
                <a href="cart.html" class="cart-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="product-detail">
        <div class="container">
            <a href="products.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Retour aux produits
            </a>

            <div id="product-content" class="product-detail-content">
                <!-- Product details loaded by JS -->
            </div>

            <!-- Similar Products Section -->
            <div class="similar-products">
                <h2 class="section-title">Produits Similaires</h2>
                <div id="similar-container" class="similar-scroll">
                    <!-- Similar products loaded by JS -->
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>KALY 🪡</h3>
                    <div class="social-links">
                        <a href="https://www.instagram.com/ly.s_clothing_empire_?igsh=cnhoZm5jdWN3eXo1" target="_blank">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://www.tiktok.com/@kaly.125?_r=1&_t=ZM-91rjmu0hQJE" target="_blank">
                            <i class="fab fa-tiktok"></i>
                        </a>
                    </div>
                </div>
                <div class="footer-section">
                    <h3>Contact</h3>
                    <p><i class="fas fa-phone"></i> +233 054 378 5331</p>
                    <p><i class="fab fa-whatsapp"></i> +223 79 74 74 24</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = 'https://kaly-backend.onrender.com/api';
        const WHATSAPP_NUMBER = '22379747424';
        
        function getCart() {
            const cart = localStorage.getItem('kaly_cart');
            return cart ? JSON.parse(cart) : [];
        }
        
        function saveCart(cart) {
            localStorage.setItem('kaly_cart', JSON.stringify(cart));
            updateCartCount();
        }
        
        function updateCartCount() {
            const cart = getCart();
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCounts = document.querySelectorAll('.cart-count');
            cartCounts.forEach(count => {
                count.textContent = totalItems;
            });
        }
        
        function addToCart(productId) {
            fetch(`${API_URL}/products/${productId}`)
                .then(res => res.json())
                .then(product => {
                    const cart = getCart();
                    const existingItem = cart.find(item => item._id === productId);
                    
                    if (existingItem) {
                        existingItem.quantity++;
                    } else {
                        cart.push({
                            _id: product._id,
                            name: product.name,
                            price: product.price,
                            image: product.images && product.images[0] ? product.images[0] : 'https://via.placeholder.com/100',
                            quantity: 1
                        });
                    }
                    
                    saveCart(cart);
                    alert('Produit ajouté au panier! ✓');
                });
        }
        
        async function loadProductDetail() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            
            if (!productId) {
                window.location.href = 'products.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/products/${productId}`);
                const product = await response.json();
                
                displayProduct(product);
                loadSimilarProducts(productId);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayProduct(product) {
            const container = document.getElementById('product-content');
            const imageGallery = product.images && product.images.length > 0
                ? product.images.map(img => `<img src="${img}" alt="${product.name}">`).join('')
                : '<img src="https://via.placeholder.com/600x600?text=KALY" alt="Pas d\'image">';

            container.innerHTML = `
                <div class="product-images">
                    <div class="main-image">
                        ${imageGallery}
                    </div>
                </div>
                
                <div class="product-info">
                    <h1>${product.name}</h1>
                    <div class="product-price">${product.price.toLocaleString()} FCFA</div>
                    <p class="product-description">${product.description || 'Aucune description disponible'}</p>
                    
                    ${product.sizes && product.sizes.length > 0 ? `
                        <div class="product-options">
                            <label>Taille:</label>
                            <div class="size-options">
                                ${product.sizes.map(size => `
                                    <button class="size-btn">${size}</button>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${product.colors && product.colors.length > 0 ? `
                        <div class="product-options">
                            <label>Couleur:</label>
                            <div class="color-options">
                                ${product.colors.map(color => `
                                    <button class="color-btn" style="background: ${color}"></button>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="product-stock">
                        ${product.stock > 0 ? `
                            <i class="fas fa-check-circle"></i> En stock (${product.stock})
                        ` : `
                            <i class="fas fa-times-circle"></i> Rupture de stock
                        `}
                    </div>
                    
                    <div class="product-actions">
                        <button onclick="addToCart('${product._id}')" class="btn btn-primary">
                            <i class="fas fa-shopping-cart"></i> Ajouter au Panier
                        </button>
                        <button onclick="buyNow('${product._id}')" class="btn btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> Commander sur WhatsApp
                        </button>
                    </div>
                </div>
            `;

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }

        async function loadSimilarProducts(productId) {
            try {
                const response = await fetch(`${API_URL}/products/${productId}/similar`);
                const products = await response.json();
                
                const container = document.getElementById('similar-container');
                container.innerHTML = products.map(product => `
                    <div class="similar-card" onclick="location.href='product-detail.html?id=${product._id}'">
                        <img src="${product.images && product.images[0] ? product.images[0] : 'https://via.placeholder.com/300'}" 
                             alt="${product.name}">
                        <h3>${product.name}</h3>
                        <div class="price">${product.price.toLocaleString()} FCFA</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function buyNow(productId) {
            addToCart(productId);
            setTimeout(() => {
                window.location.href = 'cart.html';
            }, 500);
        }

        loadProductDetail();
        updateCartCount();
    </script>
</body>
</html>
