<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - KALY 🪡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="KALY" onerror="this.style.display='none'">
                <h1>KALY 🪡</h1>
            </div>
            
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="products.html">Produits</a>
                <a href="cart.html" class="cart-link active">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="cart-page">
        <div class="container">
            <h1>Mon Panier</h1>
            
            <div id="cart-content" class="cart-content">
                <!-- Cart items loaded by JS -->
            </div>

            <div id="empty-cart" class="empty-cart" style="display: none;">
                <i class="fas fa-shopping-cart"></i>
                <h2>Votre panier est vide</h2>
                <p>Découvrez nos produits et ajoutez vos favoris !</p>
                <a href="products.html" class="btn btn-primary">Voir les Produits</a>
            </div>

            <div id="cart-summary" class="cart-summary" style="display: none;">
                <div class="promo-section">
                    <h3>Code Promo</h3>
                    <div class="promo-input">
                        <input type="text" id="promo-code" placeholder="Entrez votre code">
                        <button onclick="applyPromo()" class="btn">Appliquer</button>
                    </div>
                    <div id="promo-message"></div>
                </div>

                <div class="summary-details">
                    <div class="summary-row">
                        <span>Sous-total:</span>
                        <span id="subtotal">0 FCFA</span>
                    </div>
                    <div class="summary-row discount" id="discount-row" style="display: none;">
                        <span>Réduction (<span id="discount-percent">0</span>%):</span>
                        <span id="discount-amount">-0 FCFA</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">0 FCFA</span>
                    </div>
                </div>

                <button onclick="checkoutWhatsApp()" class="btn btn-whatsapp btn-large">
                    <i class="fab fa-whatsapp"></i> Commander sur WhatsApp
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>KALY 🪡</h3>
                    <div class="social-links">
                        <a href="https://www.instagram.com/ly.s_clothing_empire_?igsh=cnhoZm5jdWN3eXo1" target="_blank">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://www.tiktok.com/@kaly.125?_r=1&_t=ZM-91rjmu0hQJE" target="_blank">
                            <i class="fab fa-tiktok"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/cart.js"></script>
</body>
</html>
