<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>KALY 🪡 — Vêtements & Accessoires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ── RESET & ROOT ─────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose:        #e8a0b0;
      --rose-deep:   #c9687e;
      --gold:        #c9a84c;
      --gold-light:  #f0d080;
      --dark:        #1a1218;
      --mid:         #2e2129;
      --soft:        #f7f1f3;
      --muted:       #8a717a;
      --white:       #ffffff;
      --green:       #25D366;
      --radius:      14px;
      --header-h:    64px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--soft);
      color: var(--dark);
      overflow-x: hidden;
    }

    /* ── HEADER ──────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 200;
      height: var(--header-h);
      background: rgba(26,18,24,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-inner {
      max-width: 1200px; margin: 0 auto;
      height: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
    }

    .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--rose-deep), var(--gold));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem; font-weight: 700; color: var(--white);
    }
    .logo-text span { color: var(--gold); }

    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { color: rgba(255,255,255,.7); text-decoration: none; font-size: .88rem; }

    .cart-btn { position: relative; color: var(--white); text-decoration: none; font-size: 1.1rem; padding: 6px 10px; }
    .cart-count {
      position: absolute; top: 0; right: 0;
      background: var(--rose-deep); color: var(--white); font-size: .62rem;
      width: 17px; height: 17px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .auth-area { display: flex; align-items: center; gap: 8px; }
    .btn-login { padding: 7px 16px; border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: var(--white); border-radius: 8px; cursor: pointer; text-decoration: none; }
    .btn-register { padding: 7px 16px; background: linear-gradient(135deg, var(--rose-deep), var(--gold)); color: var(--white); border: none; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; }

    /* ── HERO ────────────────────────────────────── */
    .hero {
      min-height: calc(100svh - var(--header-h));
      background: linear-gradient(165deg, var(--dark) 0%, var(--mid) 55%, #3a1e2a 100%);
      display: flex; align-items: center; position: relative; overflow: hidden;
    }

    .hero-inner { max-width: 1200px; margin: 0 auto; width: 100%; padding: 48px 20px; color: white; }
    .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; }
    .hero-sub { color: rgba(255,255,255,0.7); margin-bottom: 30px; font-size: 1.1rem; max-width: 500px; }
    .btn-hero { padding: 14px 28px; background: linear-gradient(135deg, var(--rose-deep), var(--gold)); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; display: inline-block; }

    /* ── PROMO BANNER (C'est là qu'était l'erreur) ── */
    .promo-section {
      background: linear-gradient(135deg, var(--dark) 0%, var(--mid) 60%, #3a1e2a 100%);
      padding: 64px 20px; position: relative; overflow: hidden;
      color: white; text-align: center;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo">
        <div class="logo-icon">🪡</div>
        <span class="logo-text">KALY<span>.</span></span>
      </a>
      <nav class="nav-links">
        <a href="#">Accueil</a>
        <a href="#">Produits</a>
        <a href="#" class="cart-btn">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-count">0</span>
        </a>
      </nav>
      <div class="auth-area">
        <a href="#" class="btn-login">Connexion</a>
        <a href="#" class="btn-register">S'inscrire</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">L'élégance à votre <em>style</em>.</h1>
      <p class="hero-sub">Découvrez notre nouvelle collection de vêtements et accessoires conçus pour sublimer votre quotidien.</p>
      <a href="#" class="btn-hero">Acheter maintenant</a>
    </div>
  </section>

  <section class="promo-section">
    <h2>Besoin d'aide ?</h2>
    <p>Contactez-nous directement sur WhatsApp pour vos commandes.</p>
  </section>

</body>
</html>
