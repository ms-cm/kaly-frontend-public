<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Collection - KALY 🪡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #d946ef;
            --surface: #ffffff;
            --bg: #fdfdfd;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
        }

        /* --- Hero Minimaliste --- */
        .shop-hero {
            padding: 5rem 0 3rem;
            text-align: center;
        }
        
        .shop-hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(90deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        /* --- Barre de Contrôle Flottante --- */
        .controls-bar {
            position: sticky;
            top: 90px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: var(--shadow);
            margin-bottom: 3rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-container {
            flex: 2;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 14px 14px 14px 48px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: #f1f5f9;
            font-size: 1rem;
            transition: 0.3s;
        }

        .search-container input:focus {
            background: white;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(217, 70, 239, 0.1);
        }

        .search-container i {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--accent);
        }

        .filter-pill {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: #f1f5f9;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        /* --- Grille de luxe --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .kaly-item {
            group;
            position: relative;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 10px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .kaly-item:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.1);
        }

        .image-wrapper {
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: #f1f5f9;
        }

        .image-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.8s ease;
        }

        .kaly-item:hover .image-wrapper img {
            transform: scale(1.08);
        }

        .item-info { padding: 1.5rem 0.5rem 0.5rem; }

        .item-cat {
            font-size: 0.75rem; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 1.5px;
        }

        .item-name {
            font-size: 1.3rem; font-weight: 700; margin: 0.4rem 0;
            color: var(--text-main);
        }

        .item-price {
            font-size: 1.5rem; font-weight: 800; color: var(--text-main);
        }

        /* --- Boutons Magnétiques --- */
        .actions-group {
            display: flex; gap: 0.8rem; margin-top: 1.5rem;
        }

        .btn-main {
            flex: 1;
            padding: 16px; border-radius: 16px;
            border: none; background: var(--text-main); color: white;
            font-weight: 700; cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-main:hover {
            background: var(--accent);
            transform: scale(1.02);
        }

        .btn-fav {
            width: 56px; height: 56px; border-radius: 16px;
            border: 1px solid #e2e8f0; background: white;
            color: var(--text-muted); cursor: pointer; transition: 0.3s;
        }

        .btn-fav:hover {
            color: #ef4444; border-color: #fecaca; background: #fef2f2;
        }

        /* --- Squelette de chargement --- */
        .skeleton {
            background: #f1f5f9;
            animation: pulse 1.5s infinite ease-in-out;
            border-radius: 15px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* --- Mobile --- */
        @media (max-width: 768px) {
            .controls-bar { flex-direction: column; top: 70px; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .image-wrapper { height: 250px; }
            .item-name { font-size: 1rem; }
            .btn-main span { display: none; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>KALY 🪡</h1>
            </div>
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="products.html" class="active">Collection</a>
                <a href="cart.html" class="cart-link">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="shop-hero">
        <div class="container">
            <h1>L'Art du Sur-Mesure</h1>
            <p style="color: var(--text-muted)">Parcourez nos pièces exclusives conçues pour l'excellence.</p>
        </div>
    </div>

    <div class="container">
        <div class="controls-bar">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Rechercher une création...">
            </div>
            <select id="category-filter" class="filter-pill" onchange="applyFilters()">
                <option value="all">Catégories</option>
                <option value="vetements">Vêtements</option>
                <option value="sacs">Sacs</option>
                <option value="accessoires">Accessoires</option>
            </select>
            <select id="sort-filter" class="filter-pill" onchange="applyFilters()">
                <option value="newest">Nouveautés</option>
                <option value="price-asc">Prix ↑</option>
                <option value="price-desc">Prix ↓</option>
            </select>
        </div>

        <div id="products-container" class="product-grid">
            <div class="skeleton" style="height: 500px;"></div>
            <div class="skeleton" style="height: 500px;"></div>
            <div class="skeleton" style="height: 500px;"></div>
        </div>

        <div id="no-products" style="display: none; text-align: center; padding: 5rem;">
            <p style="font-size: 1.2rem; color: var(--text-muted);">Aucune pièce trouvée pour cette recherche.</p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const API_URL = 'https://kaly-backend.onrender.com/api';
        let allProducts = [];
        let filteredProducts = [];

        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                allProducts = await res.json();
                filteredProducts = [...allProducts];
                applyFilters();
            } catch (err) {
                console.error("Erreur API:", err);
                document.getElementById('products-container').innerHTML = "Erreur de connexion.";
            }
        }

        function display() {
            const container = document.getElementById('products-container');
            const noRes = document.getElementById('no-products');

            if (filteredProducts.length === 0) {
                container.innerHTML = '';
                noRes.style.display = 'block';
                return;
            }

            noRes.style.display = 'none';
            container.innerHTML = filteredProducts.map(p => `
                <div class="kaly-item">
                    <div class="image-wrapper" onclick="location.href='product-detail.html?id=${p._id}'" style="cursor:pointer">
                        <img src="${p.images?.[0] || 'https://via.placeholder.com/600'}" alt="${p.name}" loading="lazy">
                    </div>
                    <div class="item-info">
                        <span class="item-cat">${p.category}</span>
                        <h3 class="item-name">${p.name}</h3>
                        <div class="item-price">${p.price.toLocaleString()} FCFA</div>
                        
                        <div class="actions-group">
                            <button onclick="addToCart('${p._id}')" class="btn-main" ${p.stock <= 0 ? 'disabled' : ''}>
                                <i class="fas fa-plus"></i> <span>Prendre</span>
                            </button>
                            <button class="btn-fav" onclick="toggleWishlist('${p._id}')">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;
            const sort = document.getElementById('sort-filter').value;

            filteredProducts = allProducts.filter(p => {
                return p.name.toLowerCase().includes(q) && (cat === 'all' || p.category === cat);
            });

            if (sort === 'price-asc') filteredProducts.sort((a,b) => a.price - b.price);
            if (sort === 'price-desc') filteredProducts.sort((a,b) => b.price - a.price);
            if (sort === 'newest') filteredProducts.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

            display();
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);

        // Intégration fluide avec ton main.js existant
        function addToCart(id) {
            if(window.addToCart) {
                window.addToCart(id);
            }
        }

        fetchProducts();
    </script>
</body>
</html>
