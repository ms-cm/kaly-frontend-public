<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - KALYSHOP 🪡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filters-advanced {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .filter-group {
            margin-bottom: 1.5rem;
        }
        
        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }
        
        .price-range {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .price-range input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .filter-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        
        .filter-chip {
            padding: 0.5rem 1rem;
            background: var(--light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .filter-chip.active {
            background: var(--primary);
            color: white;
        }
        
        .filter-chip:hover {
            transform: translateY(-2px);
        }
        
        .sort-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .results-count {
            font-weight: 600;
            color: var(--gray);
        }
        
        .sort-select {
            padding: 0.75rem 1rem;
            border: 2px solid var(--primary);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: var(--dark);
        }
        
        .view-toggle {
            display: flex;
            gap: 0.5rem;
        }
        
        .view-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .view-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        
        .product-grid.list-view {
            grid-template-columns: 1fr;
        }
        
        .product-grid.list-view .product-card {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
        }
        
        .product-grid.list-view .product-image {
            height: 250px;
        }
        
        @media (max-width: 768px) {
            .product-grid.list-view .product-card {
                grid-template-columns: 1fr;
            }
            
            .sort-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="KALYSHOP" onerror="this.style.display='none'">
                <h1>KALYSHOP 🪡</h1>
            </div>
            
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="products.html" class="active">Produits</a>
                <a href="wishlist.html" class="wishlist-link">
                    <i class="fas fa-heart"></i>
                    <span class="wishlist-count">0</span>
                </a>
                <a href="cart.html" class="cart-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="products-page">
        <div class="container">
            <h1 style="margin: 2rem 0; font-size: 2.5rem; text-align: center;">
                Nos Produits ✨
            </h1>
            
            <!-- Filtres avancés -->
            <div class="filters-advanced">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;">
                    
                    <!-- Recherche -->
                    <div class="filter-group">
                        <label><i class="fas fa-search"></i> Rechercher</label>
                        <div style="position: relative;">
                            <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gray);"></i>
                            <input type="text" 
                                   id="search-input" 
                                   placeholder="Nom du produit..."
                                   style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 45px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
                        </div>
                    </div>
                    
                    <!-- Catégorie -->
                    <div class="filter-group">
                        <label><i class="fas fa-tags"></i> Catégorie</label>
                        <select id="category-filter" 
                                style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
                            <option value="all">Toutes les catégories</option>
                            <option value="vetements">Vêtements</option>
                            <option value="sacs">Sacs</option>
                            <option value="chaussures">Chaussures</option>
                            <option value="accessoires">Accessoires</option>
                        </select>
                    </div>
                    
                    <!-- Prix -->
                    <div class="filter-group">
                        <label><i class="fas fa-money-bill-wave"></i> Fourchette de prix (FCFA)</label>
                        <div class="price-range">
                            <input type="number" id="price-min" placeholder="Min" value="0">
                            <span>-</span>
                            <input type="number" id="price-max" placeholder="Max" value="1000000">
                        </div>
                    </div>
                    
                    <!-- Stock -->
                    <div class="filter-group">
                        <label><i class="fas fa-boxes"></i> Disponibilité</label>
                        <div class="filter-chips">
                            <div class="filter-chip active" data-stock="all">Tous</div>
                            <div class="filter-chip" data-stock="instock">En stock</div>
                            <div class="filter-chip" data-stock="outstock">Rupture</div>
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: center;">
                    <button onclick="applyFilters()" class="btn btn-primary">
                        <i class="fas fa-filter"></i> Appliquer les filtres
                    </button>
                    <button onclick="resetFilters()" class="btn btn-secondary">
                        <i class="fas fa-undo"></i> Réinitialiser
                    </button>
                </div>
            </div>
            
            <!-- Barre de tri et vue -->
            <div class="sort-bar">
                <div class="results-count">
                    <span id="results-count">0</span> produits trouvés
                </div>
                
                <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <select id="sort-select" class="sort-select" onchange="applySorting()">
                        <option value="featured">Produits vedettes</option>
                        <option value="name-asc">Nom A-Z</option>
                        <option value="name-desc">Nom Z-A</option>
                        <option value="price-asc">Prix croissant</option>
                        <option value="price-desc">Prix décroissant</option>
                        <option value="newest">Plus récents</option>
                    </select>
                    
                    <div class="view-toggle">
                        <button class="view-btn active" onclick="setView('grid')" title="Vue grille">
                            <i class="fas fa-th"></i>
                        </button>
                        <button class="view-btn" onclick="setView('list')" title="Vue liste">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Grille de produits -->
            <div id="products-container" class="product-grid">
                <!-- Chargement -->
            </div>

            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Chargement...
            </div>

            <div id="no-products" class="no-products" style="display: none;">
                <i class="fas fa-box-open"></i>
                <p>Aucun produit trouvé</p>
            </div>
            
            <!-- Pagination -->
            <div id="pagination" style="display: none; margin-top: 3rem; text-align: center;">
                <div style="display: inline-flex; gap: 0.5rem;">
                    <button onclick="changePage(-1)" class="btn btn-secondary">
                        <i class="fas fa-chevron-left"></i> Précédent
                    </button>
                    <span id="page-info" style="padding: 0 1rem; display: flex; align-items: center; font-weight: 600;"></span>
                    <button onclick="changePage(1)" class="btn btn-secondary">
                        Suivant <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>KALYSHOP 🪡</h3>
                    <p>Vêtements et accessoires cousus avec passion</p>
                    <div class="social-links">
                        <a href="https://www.instagram.com/ly.s_clothing_empire_?igsh=cnhoZm5jdWN3eXo1" target="_blank">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://www.tiktok.com/@kaly.125?_r=1&_t=ZM-91rjmu0hQJE" target="_blank">
                            <i class="fab fa-tiktok"></i>
                        </a>
                    </div>
                </div>
                
                <div class="footer-section">
                    <h3>Contact</h3>
                    <p><i class="fas fa-phone"></i> +233 054 378 5331</p>
                    <p><i class="fab fa-whatsapp"></i> +223 79 74 74 24</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        const API_URL = 'https://kaly-backend.onrender.com/api';
        
        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        let productsPerPage = 12;
        let currentView = 'grid';
        
        const CURRENCY_DATA = {
            XOF: { symbol: 'FCFA', rate: 1 }
        };
        
        let selectedCurrency = localStorage.getItem('kaly_currency') || 'XOF';
        
        function formatPrice(price) {
            return `${price.toLocaleString()} FCFA`;
        }

        // Charger les produits
        async function loadProducts() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('products-container');
            
            loading.style.display = 'block';
            
            try {
                const response = await fetch(`${API_URL}/products`);
                allProducts = await response.json();
                filteredProducts = [...allProducts];
                
                loading.style.display = 'none';
                applyFilters();
            } catch (error) {
                console.error('Error:', error);
                loading.style.display = 'none';
                container.innerHTML = '<p style="text-align: center; color: red;">Erreur de chargement</p>';
            }
        }

        // Appliquer les filtres
        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const minPrice = parseInt(document.getElementById('price-min').value) || 0;
            const maxPrice = parseInt(document.getElementById('price-max').value) || Infinity;
            const stockFilter = document.querySelector('.filter-chip.active[data-stock]').dataset.stock;
            
            filteredProducts = allProducts.filter(product => {
                const matchSearch = product.name.toLowerCase().includes(search);
                const matchCategory = category === 'all' || product.category === category;
                const matchPrice = product.price >= minPrice && product.price <= maxPrice;
                const matchStock = stockFilter === 'all' || 
                                  (stockFilter === 'instock' && product.stock > 0) ||
                                  (stockFilter === 'outstock' && product.stock === 0);
                
                return matchSearch && matchCategory && matchPrice && matchStock;
            });
            
            applySorting();
        }

        // Appliquer le tri
        function applySorting() {
            const sortBy = document.getElementById('sort-select').value;
            
            switch(sortBy) {
                case 'name-asc':
                    filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    filteredProducts.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case 'price-asc':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-desc':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'newest':
                    filteredProducts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
                case 'featured':
                    filteredProducts.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
                    break;
            }
            
            currentPage = 1;
            displayProducts();
        }

        // Afficher les produits
        function displayProducts() {
            const container = document.getElementById('products-container');
            const noProducts = document.getElementById('no-products');
            const resultsCount = document.getElementById('results-count');
            
            resultsCount.textContent = filteredProducts.length;
            
            if (filteredProducts.length === 0) {
                container.innerHTML = '';
                noProducts.style.display = 'block';
                document.getElementById('pagination').style.display = 'none';
                return;
            }
            
            noProducts.style.display = 'none';
            
            const start = (currentPage - 1) * productsPerPage;
            const end = start + productsPerPage;
            const productsToShow = filteredProducts.slice(start, end);
            
            container.innerHTML = productsToShow.map((product, i) => `
                <div class="product-card" data-aos="fade-up" style="animation-delay: ${i * 0.1}s">
                    <div class="product-image">
                        <img src="${product.images?.[0] || 'https://via.placeholder.com/300'}" 
                             alt="${product.name}"
                             loading="lazy">
                        ${product.featured ? '<span class="product-badge">⭐ Vedette</span>' : ''}
                        <button class="wishlist-btn" onclick="event.stopPropagation(); toggleWishlist('${product._id}')">
                            <i class="fas fa-heart"></i>
                        </button>
                        <div class="quick-view-btn" onclick="event.stopPropagation(); quickView('${product._id}')">
                            <i class="fas fa-eye"></i> Aperçu
                        </div>
                    </div>
                    <div class="product-content" onclick="location.href='product-detail.html?id=${product._id}'">
                        <div class="product-category">${product.category}</div>
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">${formatPrice(product.price)}</div>
                        <div class="product-stock ${product.stock > 0 ? '' : 'out-of-stock'}">
                            <i class="fas ${product.stock > 0 ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                            ${product.stock > 0 ? `En stock (${product.stock})` : 'Rupture'}
                        </div>
                        <button onclick="event.stopPropagation(); addToCart('${product._id}')" 
                                class="btn btn-primary btn-add-cart"
                                ${product.stock === 0 ? 'disabled' : ''}>
                            <i class="fas fa-cart-plus"></i> Ajouter
                        </button>
                    </div>
                </div>
            `).join('');
            
            updatePagination();
        }

        // Pagination
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const pageInfo = document.getElementById('page-info');
            const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
            
            if (totalPages > 1) {
                pagination.style.display = 'block';
                pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
            } else {
                pagination.style.display = 'none';
            }
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
            currentPage += direction;
            
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            displayProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Changer vue
        function setView(view) {
            currentView = view;
            const container = document.getElementById('products-container');
            const buttons = document.querySelectorAll('.view-btn');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.closest('.view-btn').classList.add('active');
