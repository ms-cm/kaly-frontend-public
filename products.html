<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - KALYSHOP 🪡</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d946ef;
            --primary-light: #fdf4ff;
            --dark: #1e293b;
            --gray: #64748b;
            --light-gray: #f1f5f9;
        }

        /* --- Design Amélioré des Filtres --- */
        .filters-advanced {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            margin-bottom: 3rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border: 1px solid var(--light-gray);
        }
        
        .filter-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--dark);
            font-size: 0.95rem;
        }
        
        .filter-group input, .filter-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--light-gray);
            border-radius: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .filter-group input:focus { border-color: var(--primary); }
        
        /* --- Grille de Produits Améliorée --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--light-gray);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
        }

        .product-image {
            height: 320px;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.2rem;
            margin: 0.5rem 0;
            color: var(--dark);
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        /* --- Fix Taille Boutons et Placement --- */
        .product-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-add-cart {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add-cart:hover { opacity: 0.9; transform: scale(1.02); }

        .wishlist-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .wishlist-btn:hover { background: var(--primary); color: white; }

        /* --- Vue Liste Fix --- */
        .product-grid.list-view .product-card {
            flex-direction: row;
            height: 250px;
        }
        .product-grid.list-view .product-image {
            width: 250px;
            height: 100%;
        }

        @media (max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .product-image { height: 200px; }
            .product-grid.list-view .product-card { flex-direction: column; height: auto; }
            .product-grid.list-view .product-image { width: 100%; }
            .product-title { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>KALYSHOP 🪡</h1>
            </div>
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="products.html" class="active">Produits</a>
                <a href="cart.html" class="cart-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="products-page">
        <div class="container">
            <h1 style="margin: 2rem 0; font-weight: 900; text-align: center;">Nos Créations ✨</h1>
            
            <div class="filters-advanced">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                    <div class="filter-group">
                        <label><i class="fas fa-search"></i> Recherche</label>
                        <input type="text" id="search-input" placeholder="Ex: Robe en soie...">
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-tags"></i> Catégorie</label>
                        <select id="category-filter" onchange="applyFilters()">
                            <option value="all">Tout voir</option>
                            <option value="vetements">Vêtements</option>
                            <option value="accessoires">Accessoires</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-coins"></i> Budget Max</label>
                        <input type="number" id="price-max" value="1000000" oninput="applyFilters()">
                    </div>
                </div>
            </div>

            <div class="sort-bar">
                <div class="results-count"><span id="results-count">0</span> modèles disponibles</div>
                <div class="view-toggle">
                    <button class="view-btn active" onclick="setView('grid')"><i class="fas fa-th"></i></button>
                    <button class="view-btn" onclick="setView('list')"><i class="fas fa-list"></i></button>
                </div>
            </div>

            <div id="products-container" class="product-grid"></div>
            <div id="loading" style="text-align: center; padding: 3rem; display:none;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
            <div id="no-products" style="display: none; text-align: center; padding: 5rem;">
                <i class="fas fa-box-open fa-3x" style="color: #ccc;"></i>
                <p>Aucun modèle trouvé.</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const API_URL = 'https://kaly-backend.onrender.com/api';
        let allProducts = [];
        let filteredProducts = [];

        async function loadProducts() {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await fetch(`${API_URL}/products`);
                allProducts = await res.json();
                filteredProducts = [...allProducts];
                displayProducts();
            } catch (e) {
                console.error(e);
            }
            document.getElementById('loading').style.display = 'none';
        }

        function displayProducts() {
            const container = document.getElementById('products-container');
            const resCount = document.getElementById('results-count');
            resCount.textContent = filteredProducts.length;

            if(filteredProducts.length === 0) {
                document.getElementById('no-products').style.display = 'block';
                container.innerHTML = '';
                return;
            }
            document.getElementById('no-products').style.display = 'none';

            container.innerHTML = filteredProducts.map(p => `
                <div class="product-card">
                    <div class="product-image" onclick="location.href='product-detail.html?id=${p._id}'" style="cursor:pointer">
                        <img src="${p.images?.[0] || 'https://via.placeholder.com/300'}" alt="${p.name}">
                    </div>
                    <div class="product-content">
                        <div>
                            <span style="font-size: 0.8rem; color: var(--primary); font-weight: bold; text-transform: uppercase;">${p.category}</span>
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">${p.price.toLocaleString()} FCFA</div>
                        </div>
                        <div class="product-actions">
                            <button onclick="addToCart('${p._id}')" class="btn-add-cart">
                                <i class="fas fa-shopping-bag"></i> Prendre
                            </button>
                            <button class="wishlist-btn" onclick="toggleWishlist('${p._id}')">
                                <i class="far fa-heart"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;
            const max = document.getElementById('price-max').value;

            filteredProducts = allProducts.filter(p => {
                return p.name.toLowerCase().includes(search) && 
                       (cat === 'all' || p.category === cat) &&
                       (p.price <= max);
            });
            displayProducts();
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);

        function setView(v) {
            const container = document.getElementById('products-container');
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            if(v === 'list') container.classList.add('list-view');
            else container.classList.remove('list-view');
            event.currentTarget.classList.add('active');
        }

        function addToCart(id) {
            if(window.addToCart) window.addToCart(id);
            else alert("Produit ajouté !");
        }

        loadProducts();
    </script>
</body>
</html>
